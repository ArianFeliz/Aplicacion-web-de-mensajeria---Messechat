{% extends "base.html" %}
{% block titulo %}Tu perfil · MesseChat{% endblock %}
{% block contenido %}
<div class="pantalla-centrada fondo-auth">
  <i class="bi bi-chat-heart-fill icono-flotante-auth i1"></i>
  <i class="bi bi-send-fill icono-flotante-auth i2"></i>
  <i class="bi bi-emoji-smile-fill icono-flotante-auth i3"></i>
  <i class="bi bi-chat-dots-fill icono-flotante-auth i4"></i>

  <form class="tarjeta tarjeta-auth" method="POST">
    <div class="logo-auth"><i class="bi bi-card-text"></i></div>
    <h1>Describe tu perfil</h1>
    <p class="subtitulo">Paso 3 de 4 · Una breve bio (opcional)</p>
    <div class="campo">
      <textarea name="descripcion" rows="4" maxlength="300" placeholder="Cuéntanos algo sobre ti..."></textarea>
    </div>
    <button class="btn" style="width:100%;" type="submit">Continuar</button>
  </form>
</div>
{% endblock %}
