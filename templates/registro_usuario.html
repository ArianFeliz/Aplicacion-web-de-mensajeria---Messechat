{% extends "base.html" %}
{% block titulo %}Elige tu usuario · MesseChat{% endblock %}
{% block contenido %}
<div class="pantalla-centrada fondo-auth">
  <i class="bi bi-chat-heart-fill icono-flotante-auth i1"></i>
  <i class="bi bi-send-fill icono-flotante-auth i2"></i>
  <i class="bi bi-emoji-smile-fill icono-flotante-auth i3"></i>
  <i class="bi bi-chat-dots-fill icono-flotante-auth i4"></i>

  <form class="tarjeta tarjeta-auth" method="POST">
    <div class="logo-auth"><i class="bi bi-person-fill"></i></div>
    <h1>Tu usuario público</h1>
    <p class="subtitulo">Paso 2 de 4 · Debe ser único, otros te buscarán con él</p>
    <div class="campo campo-icono">
      <i class="bi bi-at"></i>
      <input type="text" name="usuario_publico" pattern="[a-zA-Z0-9_\.]{3,30}" required
             placeholder="ej. ana_martinez">
    </div>
    <button class="btn" style="width:100%;" type="submit">Continuar</button>
  </form>
</div>
{% endblock %}
