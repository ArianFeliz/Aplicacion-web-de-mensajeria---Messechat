{% extends "base.html" %}
{% block titulo %}Iniciar sesión · MesseChat{% endblock %}
{% block contenido %}
<div class="pantalla-centrada fondo-auth">
  <i class="bi bi-chat-heart-fill icono-flotante-auth i1"></i>
  <i class="bi bi-send-fill icono-flotante-auth i2"></i>
  <i class="bi bi-emoji-smile-fill icono-flotante-auth i3"></i>
  <i class="bi bi-chat-dots-fill icono-flotante-auth i4"></i>

  <form class="tarjeta tarjeta-auth" method="POST">
    <div class="logo-auth"><i class="bi bi-chat-dots-fill"></i></div>
    <h1>Bienvenido de nuevo</h1>
    <p class="subtitulo">Inicia sesión en MesseChat</p>
    <div class="campo campo-icono">
      <i class="bi bi-envelope-fill"></i>
      <input type="email" name="correo" placeholder="Correo" required>
    </div>
    <div class="campo campo-icono">
      <i class="bi bi-lock-fill"></i>
      <input type="password" name="contrasena" placeholder="Contraseña" required>
    </div>
    <button class="btn" style="width:100%;" type="submit">Entrar</button>
    <div class="enlaces-alternos">
      <a href="{{ url_for('auth.inicio_seccion') }}">Volver</a>
      <a href="{{ url_for('auth.registro_credenciales') }}">Crear cuenta</a>
    </div>
  </form>
</div>
{% endblock %}
